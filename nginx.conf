# ============================================================================
# NGINX КОНФИГУРАЦИЯ ДЛЯ DOCFLOW (DOCKER STANDARDS)
# ============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Увеличиваем лимит для загрузки файлов
    client_max_body_size 20M;

    # Глобально включаем кодировку UTF-8 (для поддержки русских имен файлов)
    charset utf-8;

    server {
        listen 8080;
        server_name _;

        # ====================================================================
        # СТАТИКА (CSS, JS админки)
        # ====================================================================
        location /static/ {
            alias /app/staticfiles/;
        }

        # ====================================================================
        # МЕДИА-ФАЙЛЫ (загруженные документы и аватары)
        # ====================================================================
        location /media/ {
            alias /app/media/;

            # Включаем кодировку UTF-8 в /media/
            charset utf-8;

            # Запрещаем выполнение любых бэкэнд-скриптов в папке media
            location ~* \.(php|pl|py|jsp|sh|cgi)$ {
                deny all;
            }
        }

        # ====================================================================
        # ПРОКСИРОВАНИЕ В DJANGO
        # ====================================================================
        location / {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}