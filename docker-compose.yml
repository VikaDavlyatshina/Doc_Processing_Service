# ============================================================================
# DOCKER COMPOSE ДЛЯ DOCFLOW (Сервис обработки документов)
# ============================================================================
# Этот файл описывает все контейнеры, необходимые для работы приложения
# Запуск: docker compose up -d
# Остановка: docker compose down
# ============================================================================

# ============================================================================
# СЕРВИСЫ (каждый сервис = один контейнер)
# ============================================================================
services:

  # --------------------------------------------------------------------------
  # 1. POSTGRESQL — база данных
  # --------------------------------------------------------------------------
  # Хранит: пользователей, документы, логи, задачи Celery Beat
  # Данные сохраняются в томе postgres_data (не теряются при перезапуске)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine                    # Официальный образ (лёгкая версия)
    env_file:                                    # Берём переменные из .env
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}                    # Имя базы данных
      POSTGRES_USER: ${DB_USER}                  # Пользователь БД
      POSTGRES_PASSWORD: ${DB_PASSWORD}          # Пароль
    ports:
      - "5433:5432"                              # Стандартный порт PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data   # Том для сохранения данных
    healthcheck:                                 # Проверка, что БД готова к работе
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped                      # Авто restart при падении

  # --------------------------------------------------------------------------
  # 2. REDIS — брокер сообщений для Celery
  # --------------------------------------------------------------------------
  # Celery кладёт задачи в Redis, worker их забирает
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"                              # Стандартный порт Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # 3. BACKEND — Django + Gunicorn (основной сервер)
  # --------------------------------------------------------------------------
  # Обрабатывает API запросы, отдаёт страницы админки
  # Собирается из Dockerfile в текущей папке
  # --------------------------------------------------------------------------
  backend:
    build: .
    # Добавлена команда автоматического создания админа (createsuperuser --noinput)
    # Контейнер сделает миграции, создаст суперпользователя из .env и запустит Gunicorn.
    # Если админ уже создан, команда благодаря "|| true" не уронит контейнер, а пойдет дальше.
    command: >
      sh -c "python manage.py migrate && 
             python manage.py collectstatic --noinput && 
             python manage.py createsuperuser --noinput || true && 
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8001:8000"                              # Порт Gunicorn
    env_file:
      - .env
    depends_on:                                   # Запускается только после PostgreSQL и Redis
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles            # Статика для Nginx
      - media_volume:/app/media                   # Загруженные пользователем файлы
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # 4. CELERY WORKER — выполняет фоновые задачи
  # --------------------------------------------------------------------------
  # Отправка писем, уведомления, проверка просроченных документов
  # --------------------------------------------------------------------------
  celery:
    build: .
    command: celery -A config worker -l info      # Запуск воркера
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_volume:/app/media                   # Для доступа к загруженным файлам
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # 5. CELERY BEAT — планировщик периодических задач
  # --------------------------------------------------------------------------
  # Запускает задачи по расписанию (например, check_overdue_documents каждые 2 часа)
  # --------------------------------------------------------------------------
  celery-beat:
    build: .
    command: celery -A config beat -l info
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # 6. NGINX — веб-сервер
  # --------------------------------------------------------------------------
  # Отдаёт статику (CSS, JS) и медиа-файлы (документы, аватары)
  # Остальные запросы проксирует в Django (backend)
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"                         # HTTP (стандартный порт сайтов)
      - "443:443"                                # HTTPS (если настроите SSL)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf       # Конфигурация Nginx
      - static_volume:/app/staticfiles           # Статика (CSS, JS)
      - media_volume:/app/media                  # Загруженные файлы
    depends_on:
      - backend
    restart: always

# ============================================================================
# ТОМА (persistent storage)
# ============================================================================
# Данные, которые сохраняются даже после остановки контейнеров
# Без томов при перезапуске всё потеряется
# ============================================================================
volumes:
  postgres_data:      # Данные PostgreSQL (БД)
  static_volume:      # Собранная статика (CSS, JS админки)
  media_volume:       # Загруженные пользователем файлы (документы, аватары)