# ============================================================================
# ИМЯ ПАЙПЛАЙНА
# ============================================================================
name: DocProcessingService CI/CD Pipeline

# ============================================================================
# КОГДА ЗАПУСКАТЬ
# ============================================================================
on: [push, pull_request]

jobs:

  # ==========================================================================
  # ЭТАП 1: ЛИНТИНГ
  # ==========================================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Run Flake8
        run: flake8 . --max-line-length=119

  # ==========================================================================
  # ЭТАП 2: ТЕСТЫ
  # ==========================================================================
  test:
    runs-on: ubuntu-latest
    needs: lint

    # Общие переменные для всего этапа
    env:
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DB: 0
      SECRET_KEY: test-secret
      DEBUG: "True"
      LANGUAGE_CODE: "en-us"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: "587"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      EMAIL_USE_TLS: "True"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry
      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction
      - name: Run migrations
        run: python manage.py migrate
      - name: Run tests
        run: python manage.py test

  # ==========================================================================
  # ЭТАП 3: ДЕПЛОЙ (Сборка происходит прямо на вашем сервере)
  # ==========================================================================
  deploy:
    runs-on: ubuntu-latest
    needs: test # Запускается строго после успешного прохождения тестов
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      # Сначала копируем docker-compose.yml, nginx.conf и Dockerfile на сервер
      - name: Copy project files to Server
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" \
            --exclude '.git' --exclude '__pycache__' --exclude '.venv' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:/home/${{ secrets.SSH_USER }}/Doc_Processing_Service/

      - name: Deploy with Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no -T ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
            cd /home/${{ secrets.SSH_USER }}/Doc_Processing_Service
            
            # Безопасно создаем .env из ключа PRODUCTION_ENV
            echo \"${{ secrets.PRODUCTION_ENV }}\" > .env
            
            # Перезапускаем контейнеры со сборкой свежего кода
            docker compose down
            docker compose up -d --build
            
            # Ждём готовности базы данных и бэкенда к миграциям
            sleep 10
            
            # Применяем миграции внутри контейнера (Флаг -T обязателен для CI/CD!)
            docker compose exec -T backend python manage.py migrate
            
            # Инициализируем ролевые группы прав доступа
            docker compose exec -T backend python manage.py setup_moderator_group
            docker compose exec -T backend python manage.py setup_user_manager_group
            
            # Очищаем старые неиспользуемые Docker-слои для экономии места на диске
            docker image prune -f
          "