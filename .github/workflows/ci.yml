# ============================================================================
# ИМЯ ПАЙПЛАЙНА
# ============================================================================
name: DocProcessingService CI/CD Pipeline

# ============================================================================
# КОГДА ЗАПУСКАТЬ
# ============================================================================
on: [push, pull_request]

jobs:

  # ==========================================================================
  # ЭТАП 1: ЛИНТИНГ
  # ==========================================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Run Flake8
        run: flake8 . --max-line-length=119

  # ==========================================================================
  # ЭТАП 2: ТЕСТЫ
  # ==========================================================================
  test:
    runs-on: ubuntu-latest
    needs: lint

    # Общие переменные для всего этапа
    env:
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DB: 0
      SECRET_KEY: test-secret
      DEBUG: "True"
      LANGUAGE_CODE: "en-us"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: "587"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      EMAIL_USE_TLS: "True"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry
      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction
      - name: Run migrations
        run: python manage.py migrate
      - name: Run tests
        run: python manage.py test

  # ==========================================================================
  # ЭТАП 3: СБОРКА И ПУБЛИКАЦИЯ
  # ==========================================================================
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin
      - name: Build and Push
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/docflow:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/docflow:${{ github.sha }}

  # ==========================================================================
  # ЭТАП 4: ДЕПЛОЙ
  # ==========================================================================
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy with Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no -T ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
            # Создаём папку проекта
            mkdir -p /home/${{ secrets.SSH_USER }}/Doc_Processing_Service
            cd /home/${{ secrets.SSH_USER }}/Doc_Processing_Service
            
            # Создаём docker-compose.yml
            cat > docker-compose.yml << 'DOCKER_COMPOSE_EOF'
            $(cat docker-compose.yml)
            DOCKER_COMPOSE_EOF
            
            # Создаём .env из секрета
            cat > .env << 'ENV_EOF'
            ${{ secrets.PRODUCTION_ENV }}
            ENV_EOF
            
            # Запускаем контейнеры
            docker compose down
            docker compose pull
            docker compose up -d --build
            
            # Ждём готовности бэкенда
            sleep 10
            
            # Применяем миграции
            docker compose exec -T backend python manage.py migrate
            
            # Создаём группы
            docker compose exec -T backend python manage.py setup_moderator_group
            docker compose exec -T backend python manage.py setup_user_manager_group
            
            # Очистка
            docker image prune -f
          "